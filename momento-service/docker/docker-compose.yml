version: '3.8'

name: momento

services:
  momento-db:
    image: postgres:13
    environment:
      POSTGRES_DB: momentodb
      POSTGRES_USER: momento
      POSTGRES_PASSWORD: momento
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init-scripts:/docker-entrypoint-initdb.d/

  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,rekognition
      - DEFAULT_REGION=us-east-1
    volumes:
      - localstack-data:/var/lib/localstack

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@momento.com
      PGADMIN_DEFAULT_PASSWORD: admin

volumes:
  postgres-data:
  localstack-data:
