app:
  admin:
    email: ${ADMIN_EMAIL:admin@momento.com}
    password: ${ADMIN_PASSWORD:admin123}

application:
  url: http://localhost:8080/momento-service
  enforce-ssl: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  banner:
    location: classpath:/banner.txt
  datasource:
    url: jdbc:postgresql://localhost:5432/momentodb
    username: momento
    password: momento
    hikari:
      minimum-idle: 5
      maximum-pool-size: 25
      idle-timeout: 30000

  jpa:
    database: default
    open-in-view: false
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: momento
        dialect: org.hibernate.dialect.PostgreSQLDialect
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
      org.hibernate.envers.use_revision_entity_with_native_id: false
      org.hibernate.envers.store_data_at_delete: true
      org.hibernate.envers.audit_strategy: org.hibernate.envers.strategy.ValidityAuditStrategy
      org.hibernate.envers.audit_strategy_validity_store_revend_timestamp: true

  flyway:
    enabled: true
    create-schemas: true
    # baseline-on-migrate: true
    schemas: momento

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET:momento-photos}
  sqs:
    queue-url: ${AWS_SQS_QUEUE_URL:}
  rekognition:
    collection-id-prefix: ${AWS_REKOGNITION_PREFIX:momento_event_}

storage:
  local:
    dir: ${STORAGE_LOCAL_DIR:./storage}

  jackson:
    date-format: com.fasterxml.jackson.databind.util.ISO8601DateFormat
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

debug: false
logging:
  register-shutdown-hook: true
  level:
    root: info
    com.map: debug
#    org.hibernate.orm.jdbc.bind: off
#    org.hibernate.SQL: error
#    org.hibernate.type: error
#    org.hibernate.type.descriptor.sql: error
#    org.springframework.jdbc.core: error
#    org.springframework.orm.jpa: error
#    org.springframework.transaction: error

management:
  info:
    git:
      mode: full
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: "*"
